<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clicker Heroes — 클릭으로 히어로를 부르고 몬스터를 쓰러뜨려라!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 로그인 모달 -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2>계정으로 로그인하세요</h2>
    <form id="login-form">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@example.com" required />

      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="••••••••" required />

      <button type="submit" class="btn-primary">로그인</button>
    </form>
    <p>계정이 없으신가요? <a href="#">회원가입하기</a></p>
  </div>
</div>

<!-- 에러 모달 -->
<div id="error-modal" class="modal error">
  <div class="modal-content">
    <h2>❌ 오류 발생!</h2>
    <p id="error-message">예기치 않은 오류가 발생했습니다.</p>
    <button class="btn-error" onclick="closeErrorModal()">확인</button>
  </div>
</div>

<!-- 메인 화면 -->
<main class="game-container">
  <header class="game-header">
    <h1>Clicker Heroes</h1>
    <p class="subtitle">히어로들을 고용하고 몬스터를 쓰러뜨리세요!</p>
    <button id="login-btn" class="btn-secondary">로그인</button>
  </header>

  <section class="game-area">
    <div class="monster-container">
      <img src="./assets/monsters/goblin.png" alt="고블린 몬스터" id="monster-img" />
      <h2 id="current-monster-name">고블린</h2>
      <p class="hp-display">
        HP: <span id="monster-hp">100</span> / <span id="max-hp">100</span>
      </p>
    </div>

    <div class="click-area">
      <button id="attack-btn" class="btn-attack">클릭하여 공격!</button>
      <p class="score-display">
        점수: <strong id="score">0</strong>
      </p>
    </div>

    <aside class="upgrades-panel">
      <h3>히어로 업그레이드</h3>
      <ul id="hero-list">
        <li>
          <span>초보 전사</span>
          <small>공격력 +5 / 1초당 0.5 데미지</small>
          <button class="btn-upgrade">고용 (50$)</button>
        </li>
      </ul>
    </aside>
  </section>

  <footer>
    © 2025 Clicker Heroes Clone | Developed by You
  </footer>
</main>

<!-- JS 로드 -->
<script src="script.js"></script>
</body>
</html>
